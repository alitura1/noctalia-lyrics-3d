# plugin.toml — Noctalia v5 plugin manifest
# 3D desktop lyrics for Noctalia v5 (Luau host + Quickshell renderer bridge).

id = "alitura/noctalia-lyrics-3d"
name = "Noctalia Lyrics 3D"
version = "2.3.0"
plugin_api = 51
author = "alitura"
license = "MIT"
icon = "music"
description = "Desktop lyrics with real 3D perspective, wallpaper-aware colours, an LRCLIB cache and Hyprland window rules."
tags = ["desktop", "lyrics", "music", "hyprland", "layer"]
dependencies = ["quickshell", "hyprctl", "playerctl", "curl"]

# ── Shared plugin settings (Settings → Plugins → gear) ──────────────────────

[[setting]]
key = "enabled"
type = "bool"
label_key = "settings.enabled.label"
description_key = "settings.enabled.description"
default = true

[[setting]]
key = "font_size"
type = "int"
label_key = "settings.font_size.label"
description_key = "settings.font_size.description"
default = 38
min = 12
max = 96

[[setting]]
key = "font_family"
type = "string"
label_key = "settings.font_family.label"
description_key = "settings.font_family.description"
default = ""

[[setting]]
key = "font_weight"
type = "int"
label_key = "settings.font_weight.label"
description_key = "settings.font_weight.description"
default = 600
min = 100
max = 900
step = 50

[[setting]]
key = "line_spacing"
type = "int"
label_key = "settings.line_spacing.label"
description_key = "settings.line_spacing.description"
default = 12
min = 0
max = 40

[[setting]]
key = "max_lines"
type = "int"
label_key = "settings.max_lines.label"
description_key = "settings.max_lines.description"
default = 9
min = 3
max = 15

[[setting]]
key = "width_percent"
type = "double"
label_key = "settings.width_percent.label"
description_key = "settings.width_percent.description"
default = 0.62
min = 0.3
max = 0.95
step = 0.01

[[setting]]
