# ── Entries ─────────────────────────────────────────────────────────────────

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "controls"
entry = "controls.luau"
width = 480
height = 760
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "on_demand"

[[shortcut]]
id = "lyrics-toggle"
entry = "shortcut.luau"
